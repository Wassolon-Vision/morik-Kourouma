<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HAMAC SERVICES – Comptes clients</title>
<meta name="theme-color" content="#0e3b5a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="firebase-config.js"></script>
<style>
:root{--bleu:#1f9ad6;--marine:#0e3b5a;--vert:#0b9444;--rouge:#e3202b;--orange:#f26522;--jaune:#fcd116;--fond:#f3f8fb;--texte:#16303f;--ligne:#d5e4ec}
*{box-sizing:border-box}
body{margin:0;font-family:"Trebuchet MS","Segoe UI",sans-serif;background:var(--fond);color:var(--texte);display:flex;min-height:100vh}
body::before{content:"";position:fixed;inset:0;background:url(logo.png) center/min(75vmin,560px) no-repeat;opacity:.07;pointer-events:none;z-index:0}
aside,main{position:relative;z-index:1}
aside{width:220px;background:var(--marine);color:#fff;padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto;flex-shrink:0}
aside img{width:110px;display:block;margin:0 auto 6px;background:#fff;border-radius:50%}
aside h1{font-size:15px;text-align:center;margin:0 0 14px}
aside button{display:block;width:100%;text-align:left;background:none;border:0;color:#cfe6f3;padding:10px 12px;border-radius:8px;font:inherit;cursor:pointer;border-left:4px solid transparent}
aside button:hover,aside button.on{background:#17506f;color:#fff}
aside button.on{border-left-color:var(--jaune)}
main{flex:1;padding:20px;min-width:0}
h2{margin:0 0 12px;font-size:22px;color:var(--marine)}
.top{display:flex;gap:4px 18px;flex-wrap:wrap;font-size:14px;margin-bottom:10px}.top a{color:var(--marine)}
.bandeau{height:5px;background:linear-gradient(90deg,var(--rouge) 33%,var(--jaune) 33% 66%,var(--vert) 66%);border-radius:3px;margin-bottom:16px}
.grille{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#ffffffee;border:1px solid var(--ligne);border-top:4px solid var(--bleu);border-radius:8px;padding:12px 14px}
.kpi small{color:#5b7482}.kpi b{display:block;font-size:20px;margin-top:4px}
.kpi.v{border-top-color:var(--vert)}.kpi.o{border-top-color:var(--orange)}.kpi.r{border-top-color:var(--rouge)}
.btn{background:var(--vert);color:#fff;border:0;padding:10px 16px;border-radius:8px;font:inherit;cursor:pointer}
.btn.s{background:#fff;color:var(--marine);border:1px solid var(--bleu)}
.btn.r{background:var(--rouge)}.btn.b{background:var(--bleu)}
.btn:focus-visible,aside button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--jaune);outline-offset:1px}
.x{background:none;border:0;color:var(--rouge);cursor:pointer;font-size:16px;padding:4px 8px}
.tab{overflow-x:auto;background:#ffffffe6;border:1px solid var(--ligne);border-radius:8px;margin-top:12px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{background:var(--marine);color:#fff;text-align:left;padding:9px 10px;white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--ligne)}
td.n{text-align:right;white-space:nowrap}
.vide{padding:22px;text-align:center;color:#5b7482}
[hidden]{display:none!important}
.modal{position:fixed;inset:0;background:#0e3b5acc;display:flex;align-items:center;justify-content:center;padding:14px;z-index:5}
.modal form{background:#fff;border-radius:10px;padding:20px;width:min(420px,100%);max-height:92vh;overflow:auto;border-top:6px solid var(--bleu)}
.modal form.g{width:min(480px,100%)}
.modal canvas{width:100%;border:1px solid var(--ligne);border-radius:6px}
label{display:block;margin:10px 0 4px;font-size:14px}
input,select{width:100%;padding:10px;border:1px solid var(--ligne);border-radius:6px;font:inherit}
.rang{display:flex;gap:8px;margin-top:16px;justify-content:flex-end;flex-wrap:wrap}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.act{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.pf{background:#ffffffee;border:1px solid var(--ligne);border-radius:8px;padding:16px;max-width:520px;margin-bottom:16px}
body.v aside,body.v main{visibility:hidden}
@media(max-width:760px){body{flex-direction:column}aside{width:100%;height:auto;position:static;display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:8px}aside img{width:48px;margin:0}aside h1{display:none}aside button{width:auto;padding:8px 10px;border-left:0;font-size:14px}main{padding:12px}}
</style>
</head>
<body>
<aside><img src="logo.png" alt="Logo HAMAC SERVICES"><h1>HAMAC SERVICES</h1><nav id="nav"></nav></aside>
<main><div class="top" id="top"></div><div class="bandeau"></div><div id="vue"></div></main>
<div id="m" hidden></div>
<script>
const CLE='hamac_services_db_v1',TAB=['clients','cotis','retraits','journal'];
let db={};try{db=JSON.parse(localStorage.getItem(CLE))||{}}catch(e){db={}}
TAB.forEach(t=>db[t]=db[t]||[]);
db.cpt=db.cpt||{};db.cpt.V=db.cpt.V||db.cpt.P||0;db.cpt.R=db.cpt.R||0;
db.params={nom:'HAMAC SERVICES',resp:'Morikè Kourouma',tel:'622717745',email:'morikekourouma29@gmail.com',adresse:'',msg:'Merci pour votre confiance',...(db.params||{})};delete db.params.pin;
const $=i=>document.getElementById(i),P=()=>db.params;
const sauve=()=>{try{localStorage.setItem(CLE,JSON.stringify(db))}catch(e){alert("Enregistrement impossible dans ce navigateur. Faites une sauvegarde JSON.")}};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const auj=()=>new Date().toISOString().slice(0,10);
const fd=d=>(d||'').split('-').reverse().join('/');
const gnf=n=>(Number(n)||0).toLocaleString('fr-FR')+' GNF';
const som=(a,k)=>a.reduce((s,x)=>s+(Number(x[k])||0),0);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cl=id=>db.clients.find(c=>c.id===id),nomC=id=>(cl(id)||{}).nom||'—';
const solde=c=>som(db.cotis.filter(x=>x.client===c),'montant')-som(db.retraits.filter(x=>x.client===c),'montant');
const ops=()=>[...db.cotis.map(x=>({...x,k:'cotis'})),...db.retraits.map(x=>({...x,k:'retraits'}))];
const tri=(a,b)=>(b.date||'').localeCompare(a.date||'')||(b.num||'').localeCompare(a.num||'');
const lib=k=>k==='cotis'?'Versement':'Retrait';
const wa=t=>{let n=(t||'').replace(/\D/g,'');if(n.length===9)n='224'+n;return n};
const log=t=>{const e={id:uid(),iso:new Date().toISOString(),ts:new Date().toLocaleString('fr-FR'),texte:t};db.journal.push(e);fbSet('journal',e)};
const NAV=[['dash','Tableau de bord'],['clients','Clients'],['cotis','Versements'],['retraits','Retraits'],['recus','Reçus'],['caisse','Caisse'],['suivi','Suivi des clients'],['rap','Rapports'],['journal','Journal'],['params','Paramètres']];
let cur='dash',fil={a:'',b:''},dip=null,FS=null,U=null,AUTH=null,erFait=false;
const EN_LIGNE=!!(window.FIREBASE_CONFIG&&window.FIREBASE_CONFIG.apiKey&&!/COLLEZ/.test(window.FIREBASE_CONFIG.apiKey));
const statut=()=>!EN_LIGNE?'Mode local (non synchronisé)':!U?'Connexion…':navigator.onLine?'● En ligne (synchronisé)':'● Hors ligne : envoi au retour d’internet';
const nett=o=>JSON.parse(JSON.stringify(o));
const numero=p=>{const k=p==='V'?'cotis':'retraits',mx=Math.max(0,...db[k].map(x=>parseInt((x.num||'').slice(2),10)||0));db.cpt[p]=Math.max(db.cpt[p]||0,mx)+1;return p+'-'+String(db.cpt[p]).padStart(4,'0')};
const fenetre=h=>{const m=$('m');m.className='modal';m.hidden=false;m.innerHTML=h;return m};
const ferme=()=>{const m=$('m');m.hidden=true;m.innerHTML=''};

function rendu(garde){
 $('nav').innerHTML=NAV.map(([k,l])=>`<button data-k="${k}" class="${k===cur?'on':''}">${l}</button>`).join('');
 $('top').innerHTML=`<b>${esc(P().nom)}</b><span>${esc(P().resp)}</span><a href="tel:${esc(P().tel)}">${esc(P().tel)}</a><a href="mailto:${esc(P().email)}">${esc(P().email)}</a><b>${statut()}</b>`;
 const V={dash,clients:lcl,cotis:()=>lop('cotis'),retraits:()=>lop('retraits'),recus,caisse,suivi,rap,journal:jour,params:pagePar};
 $('vue').innerHTML=V[cur]();
 if(cur==='caisse')$('ff').onclick=()=>{fil.a=$('fa').value;fil.b=$('fb').value;rendu()};
 if(cur==='params')liePar();
 if(!garde)scrollTo(0,0)}

function dash(){
 const m=auj().slice(0,7),mo=a=>som(db[a].filter(x=>(x.date||'').startsWith(m)),'montant');
 const nb=db.clients.length+db.cotis.length+db.retraits.length,j=db.sauv?Math.floor((Date.now()-new Date(db.sauv))/864e5):null;
 const al=nb&&(j===null||j>=7)?`<div class="kpi r" style="margin-bottom:16px"><b style="font-size:16px">⚠ ${j===null?'Aucune sauvegarde n’a encore été faite.':'Dernière sauvegarde il y a '+j+' jours.'}</b><div class="act" style="margin:10px 0 0"><button class="btn" data-act="s">Sauvegarder maintenant</button></div></div>`:'';
 return `<h2>Tableau de bord</h2>${al}
 <div class="act"><button class="btn b" data-add="clients">Ajouter un client</button><button class="btn" data-add="cotis">Effectuer un versement</button><button class="btn r" data-add="retraits">Effectuer un retrait</button></div>
 <div class="grille"><div class="kpi v"><small>Solde de la caisse</small><b>${gnf(som(db.cotis,'montant')-som(db.retraits,'montant'))}</b></div>
 <div class="kpi v"><small>Versements du mois</small><b>${gnf(mo('cotis'))}</b></div>
 <div class="kpi r"><small>Retraits du mois</small><b>${gnf(mo('retraits'))}</b></div>
 <div class="kpi"><small>Clients</small><b>${db.clients.length}</b></div></div>`}

const tabl=(h,rows,vide)=>`<div class="tab">${rows.length?`<table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.join('')}</table>`:`<div class="vide">${vide}</div>`}</div>`;
const bRecu=(k,id)=>`<button class="btn s" data-recu="${k}|${id}">Reçu</button>`;
const bEdit=(k,id,c)=>`<button class="x" style="color:var(--bleu)" data-edit="${k}|${id}|${c||''}" aria-label="Modifier">✎</button>`;
const bDel=(k,id,c)=>`<button class="x" data-del="${k}|${id}|${c||''}" aria-label="Supprimer">✕</button>`;

function lcl(){
 const r=db.clients.slice().sort((a,b)=>a.nom.localeCompare(b.nom)).map(c=>`<tr><td>${esc(c.nom)}</td><td>${esc(c.tel)}</td><td>${esc(c.quartier)}</td><td class="n"><b>${gnf(solde(c.id))}</b></td><td><button class="btn s" data-det="${c.id}">Détail</button></td><td>${bEdit('clients',c.id)}</td><td>${bDel('clients',c.id)}</td></tr>`);
 return `<h2>Clients</h2><div class="bar"><button class="btn b" data-add="clients">Ajouter un client</button><span>${db.clients.length} client(s)</span></div>${tabl(['Nom','Téléphone','Quartier','Solde','','',''],r,'Aucun client. Cliquez sur « Ajouter un client ».')}`}

function lop(k){
 const r=db[k].slice().sort(tri).map(x=>`<tr><td>${esc(x.num)}</td><td>${fd(x.date)}</td><td>${esc(nomC(x.client))}</td><td class="n">${gnf(x.montant)}</td><td>${esc(k==='cotis'?x.mode:x.motif)}</td><td>${bRecu(k,x.id)}</td><td>${bEdit(k,x.id)}</td><td>${bDel(k,x.id)}</td></tr>`);
 return `<h2>${lib(k)}s</h2><div class="bar"><button class="btn ${k==='cotis'?'':'r'}" data-add="${k}">Effectuer un ${lib(k).toLowerCase()}</button><span>Total : <b>${gnf(som(db[k],'montant'))}</b></span></div>${tabl(['N° reçu','Date','Client','Montant',k==='cotis'?'Mode':'Motif','','',''],r,'Aucune opération pour le moment.')}`}

function recus(){
 const r=ops().sort(tri).map(x=>`<tr><td>${esc(x.num)}</td><td>${fd(x.date)}</td><td>${lib(x.k)}</td><td>${esc(nomC(x.client))}</td><td class="n">${gnf(x.montant)}</td><td><button class="btn s" data-recu="${x.k}|${x.id}">Ouvrir</button></td><td>${bEdit(x.k,x.id)}</td><td>${bDel(x.k,x.id)}</td></tr>`);
 return `<h2>Reçus</h2><p>Un reçu est créé à chaque versement et à chaque retrait. Ouvrez-le pour le télécharger en image ou l'envoyer par WhatsApp.</p>${tabl(['N°','Date','Type','Client','Montant','','',''],r,'Aucun reçu pour le moment.')}`}

function caisse(){
 const r=ops().sort((a,b)=>-tri(a,b));let s=0;r.forEach(x=>{s+=x.k==='cotis'?x.montant:-x.montant;x.cum=s});
 const v=r.filter(x=>(!fil.a||x.date>=fil.a)&&(!fil.b||x.date<=fil.b)).reverse();
 const e=som(v.filter(x=>x.k==='cotis'),'montant'),o=som(v.filter(x=>x.k==='retraits'),'montant');
 return `<h2>Situation de la caisse</h2><p>La caisse est automatique : un versement est une entrée, un retrait est une sortie.</p>
 <div class="grille"><div class="kpi v"><small>Solde actuel</small><b>${gnf(s)}</b></div><div class="kpi v"><small>Entrées (période)</small><b>${gnf(e)}</b></div><div class="kpi r"><small>Sorties (période)</small><b>${gnf(o)}</b></div><div class="kpi"><small>Solde de la période</small><b>${gnf(e-o)}</b></div></div>
 <div class="bar"><label style="margin:0">Du <input type="date" id="fa" value="${fil.a}" style="width:auto"></label><label style="margin:0">Au <input type="date" id="fb" value="${fil.b}" style="width:auto"></label><button class="btn s" id="ff">Filtrer</button></div>
 ${tabl(['Date','N° reçu','Opération','Client','Entrée','Sortie','Solde caisse'],v.map(x=>`<tr><td>${fd(x.date)}</td><td>${esc(x.num)}</td><td>${lib(x.k)}</td><td>${esc(nomC(x.client))}</td><td class="n">${x.k==='cotis'?gnf(x.montant):''}</td><td class="n">${x.k==='retraits'?gnf(x.montant):''}</td><td class="n"><b>${gnf(x.cum)}</b></td></tr>`),'Aucun mouvement sur cette période.')}`}

function suivi(){
 const r=db.clients.slice().sort((a,b)=>a.nom.localeCompare(b.nom)).map(c=>{const v=db.cotis.filter(x=>x.client===c.id),w=db.retraits.filter(x=>x.client===c.id),d=ops().filter(x=>x.client===c.id).map(x=>x.date).sort().pop();
  return `<tr><td>${esc(c.nom)}</td><td>${esc(c.tel)}</td><td class="n">${v.length}</td><td class="n">${gnf(som(v,'montant'))}</td><td class="n">${gnf(som(w,'montant'))}</td><td class="n"><b>${gnf(solde(c.id))}</b></td><td>${fd(d)||'—'}</td><td><button class="btn s" data-det="${c.id}">Détail</button></td></tr>`});
 return `<h2>Suivi des clients</h2>${tabl(['Client','Téléphone','Versements','Total versé','Total retiré','Solde','Dernière opération',''],r,'Aucun client pour le moment.')}`}

function detail(id){
 const c=cl(id);if(!c)return;
 const r=ops().filter(x=>x.client===id).sort(tri).map(x=>`<tr><td>${fd(x.date)}</td><td>${lib(x.k)}</td><td class="n">${gnf(x.montant)}</td><td>${bRecu(x.k,x.id)}</td><td>${bEdit(x.k,x.id,id)}</td><td>${bDel(x.k,x.id,id)}</td></tr>`);
 fenetre(`<form class="g"><h2>${esc(c.nom)}</h2><p>${esc(c.tel||'')} ${esc(c.quartier||'')}<br>Solde : <b>${gnf(solde(id))}</b></p>${tabl(['Date','Opération','Montant','','',''],r,'Aucune opération.')}<div class="rang"><button type="button" class="btn s" data-fm="1">Fermer</button></div></form>`)}

function rap(){
 const mois={};ops().forEach(x=>{if(!x.date)return;const m=x.date.slice(0,7);mois[m]=mois[m]||{v:0,w:0};mois[m][x.k==='cotis'?'v':'w']+=Number(x.montant)||0});
 const ms=Object.keys(mois).sort().reverse();
 const top=db.clients.slice().sort((a,b)=>solde(b.id)-solde(a.id)).slice(0,10);
 return `<h2>Rapports</h2><h3>Par mois</h3>${tabl(['Mois','Versements','Retraits','Solde du mois'],ms.map(m=>`<tr><td>${m}</td><td class="n">${gnf(mois[m].v)}</td><td class="n">${gnf(mois[m].w)}</td><td class="n"><b>${gnf(mois[m].v-mois[m].w)}</b></td></tr>`),'Aucune donnée pour le moment.')}
 <h3>Clients avec les plus gros soldes</h3>${tabl(['Client','Solde'],top.map(c=>`<tr><td>${esc(c.nom)}</td><td class="n"><b>${gnf(solde(c.id))}</b></td></tr>`),'Aucun client.')}
 <p><button class="btn s" onclick="window.print()">Imprimer le rapport</button></p>`}

function jour(){
 const r=db.journal.slice().sort((a,b)=>b.iso.localeCompare(a.iso)).map(x=>`<tr><td style="white-space:nowrap">${esc(x.ts)}</td><td>${esc(x.texte)}</td><td><button class="x" data-jdel="${x.id}" aria-label="Supprimer cette ligne">✕</button></td></tr>`);
 return `<h2>Journal</h2><p>Toutes les opérations sont inscrites ici automatiquement. Supprimer une ligne du journal ne supprime pas l'opération elle-même.</p>
 <div class="bar"><label style="margin:0">Supprimer <select id="js" style="width:auto"><option value="">— Choisir —</option><option value="30">Les lignes de plus de 30 jours</option><option value="90">Les lignes de plus de 90 jours</option><option value="all">Tout le journal</option></select></label><button class="btn r" data-act="jdel">Appliquer</button></div>${tabl(['Date et heure','Opération',''],r,'Aucune opération enregistrée.')}`}

function pagePar(){
 const f=(n,l,t='text')=>`<label>${l}<input name="${n}" type="${t}" value="${esc(P()[n])}"></label>`;
 return `<h2>Paramètres</h2><form class="pf" id="fp"><h3>Informations de l'entreprise</h3><p>Elles apparaissent en haut de l'application et sur les reçus.</p>
 ${f('nom','Nom de l\'entreprise')}${f('resp','Nom du responsable')}${f('tel','Téléphone','tel')}${f('email','E-mail','email')}${f('adresse','Adresse')}${f('msg','Message en bas du reçu')}
 <div class="rang"><button class="btn">Enregistrer</button></div></form>
 <div class="pf"><h3>Base en ligne</h3><p><b>${statut()}</b>${AUTH&&AUTH.currentUser?'<br>Compte : '+esc(AUTH.currentUser.email):''}</p>${FS&&U?'<button class="btn s" data-act="fbout">Se déconnecter de ce téléphone</button>':EN_LIGNE?'':'<p>Pour activer la base en ligne, remplissez le fichier firebase-config.js (voir le guide).</p>'}</div>
 <div class="pf"><h3>Sécurité</h3><button class="btn s" data-act="mdp">Changer le mot de passe</button><p>Le mot de passe est demandé à chaque ouverture, et de nouveau après 5 minutes d'absence.</p></div>
 <div class="pf"><h3>Données</h3><div class="act"><button class="btn s" data-act="x">Exporter vers Excel</button><button class="btn s" data-act="s">Sauvegarder (JSON)</button><button class="btn s" data-act="r">Restaurer une sauvegarde</button></div>
 <p>Les données restent sur ce téléphone. Faites une sauvegarde chaque semaine : choisissez WhatsApp, Google Drive ou e-mail pour garder le fichier en lieu sûr.</p></div>
 <div class="pf"><h3>Installer sur le téléphone</h3><button class="btn b" id="bI" data-act="i" ${dip?'':'hidden'}>Installer l'application</button>
 <p>Android (Chrome) : menu ⋮ puis « Ajouter à l'écran d'accueil » ou « Installer l'application ». iPhone (Safari) : bouton Partager puis « Sur l'écran d'accueil ».</p></div>`}
function liePar(){$('fp').onsubmit=e=>{e.preventDefault();new FormData(e.target).forEach((v,n)=>P()[n]=v.trim());log('Paramètres modifiés');fbMeta('params',P());sauve();rendu();alert('Paramètres enregistrés.')}}

function form(k,editId,back){
 if(k!=='clients'&&!db.clients.length){alert("Ajoutez d'abord un client.");return}
 const r0=editId?db[k].find(x=>x.id===editId):null;if(editId&&!r0)return;
 const sel=`<label>Client<select name="client" required><option value="">— Choisir —</option>${db.clients.slice().sort((a,b)=>a.nom.localeCompare(b.nom)).map(c=>`<option value="${c.id}">${esc(c.nom)}</option>`).join('')}</select></label>`;
 const dt=`<label>Date<input name="date" type="date" value="${auj()}" required></label>`,mt=`<label>Montant (GNF)<input name="montant" type="number" min="1" step="any" required></label>`;
 const F={clients:`<label>Nom complet<input name="nom" required></label><label>Téléphone (WhatsApp)<input name="tel" type="tel"></label><label>Quartier / ville<input name="quartier"></label>`,
  cotis:dt+sel+mt+`<label>Mode de versement<select name="mode"><option>Espèces</option><option>Mobile money</option><option>Autre</option></select></label>`,
  retraits:dt+sel+`<p id="sd"></p>`+mt+`<label>Motif<input name="motif"></label>`};
 const T={clients:'Ajouter un client',cotis:'Effectuer un versement',retraits:'Effectuer un retrait'},TE={clients:'Modifier le client',cotis:'Modifier le versement',retraits:'Modifier le retrait'};
 const m=fenetre(`<form id="ff2"><h2>${r0?TE[k]:T[k]}</h2>${F[k]}<div class="rang"><button type="button" class="btn s" data-fm="1">Annuler</button><button class="btn">Enregistrer</button></div></form>`);
 if(r0)m.querySelectorAll('[name]').forEach(el=>{if(r0[el.name]!=null)el.value=r0[el.name]});
 const sc=m.querySelector('[name=client]');
 if(k==='retraits'){const maj=()=>$('sd').innerHTML=sc.value?`Solde disponible : <b>${gnf(solde(sc.value)+(r0&&r0.client===sc.value?r0.montant:0))}</b>`:'';sc.onchange=maj;maj()}
 m.querySelector('input,select').focus();
 $('ff2').onsubmit=e=>{e.preventDefault();
  const r=r0?{...r0}:{id:uid()};new FormData(e.target).forEach((v,n)=>r[n]=n==='montant'?Number(v):v.trim());
  if(k==='clients'){db.clients=r0?db.clients.map(x=>x.id===r.id?r:x):[...db.clients,r];log((r0?'Client modifié : ':'Nouveau client : ')+r.nom)}
  else{
   if(!(r.montant>0)){alert('Entrez un montant supérieur à 0.');return}
   const av=db[k];db[k]=r0?av.map(x=>x.id===r.id?r:x):[...av,r];
   if(solde(r.client)<0||(r0&&solde(r0.client)<0)){db[k]=av;alert('Opération refusée : le solde du client deviendrait négatif.'+(r0?'':' Solde disponible : '+gnf(solde(r.client))+'.'));return}
   if(!r0){const p=k==='cotis'?'V':'R';r.num=numero(p);fbMeta('cpt',{[p]:db.cpt[p]})}
   log(`${r0?'Modification – ':''}${lib(k)} de ${gnf(r.montant)} – ${nomC(r.client)} – reçu ${r.num}`)}
  fbSet(k,r);sauve();ferme();rendu();
  if(!r0&&k!=='clients')recu(k,r.id);else if(back)detail(back)}}

function supprime(k,id,c){
 if(k==='clients'){const n=ops().filter(x=>x.client===id).length;if(!confirm('Supprimer ce client'+(n?' et ses '+n+' opération(s)':'')+' ?'))return;
  const nm=nomC(id);db.cotis.filter(x=>x.client===id).forEach(x=>fbDel('cotis',x.id));db.retraits.filter(x=>x.client===id).forEach(x=>fbDel('retraits',x.id));fbDel('clients',id);db.cotis=db.cotis.filter(x=>x.client!==id);db.retraits=db.retraits.filter(x=>x.client!==id);db.clients=db.clients.filter(x=>x.id!==id);log('Client supprimé : '+nm)}
 else{const x=db[k].find(q=>q.id===id);if(!x||!confirm('Supprimer ce '+lib(k).toLowerCase()+' '+x.num+' ?'))return;fbDel(k,id);db[k]=db[k].filter(q=>q.id!==id);log(`${lib(k)} supprimé : ${x.num} – ${gnf(x.montant)} – ${nomC(x.client)}`)}
 sauve();ferme();rendu();if(c)detail(c)}

const LOGO=new Image();LOGO.src='logo.png';
const logoOk=()=>LOGO.complete&&LOGO.naturalWidth?LOGO:null;
function dessin(k,r,logo){
 const c=document.createElement('canvas');c.width=600;c.height=880;const x=c.getContext('2d'),F='Trebuchet MS,Segoe UI,sans-serif',pay=k==='cotis',col=pay?'#0b9444':'#e3202b',p=P();
 const t=(s,px,y,al,f,fill)=>{x.font=f;x.fillStyle=fill;x.textAlign=al;x.fillText(s,px,y)};
 x.fillStyle='#fff';x.fillRect(0,0,600,880);
 if(logo){const h=Math.round(420*logo.naturalHeight/logo.naturalWidth);x.globalAlpha=.08;x.drawImage(logo,90,300,420,h);x.globalAlpha=1;x.drawImage(logo,230,34,140,Math.round(140*logo.naturalHeight/logo.naturalWidth))}
 ['#e3202b','#fcd116','#0b9444'].forEach((cl,i)=>{x.fillStyle=cl;x.fillRect(i*200,0,200,16);x.fillRect(i*200,864,200,16)});
 t(p.nom.toUpperCase(),300,212,'center','bold 28px '+F,'#0e3b5a');
 t(pay?'REÇU DE VERSEMENT':'REÇU DE RETRAIT',300,246,'center','bold 20px '+F,col);
 [['N° du reçu',r.num],['Date',fd(r.date)],['Client',nomC(r.client)],[pay?'Mode de versement':'Motif',(pay?r.mode:r.motif)||'—']].forEach(([a,b],i)=>{const y=300+i*44;t(a,40,y,'left','16px '+F,'#5b7482');t(String(b),560,y,'right','bold 17px '+F,'#16303f');x.fillStyle='#d5e4ec';x.fillRect(40,y+12,520,1)});
 x.fillStyle=col;x.fillRect(40,500,520,90);
 t(pay?'Montant versé':'Montant retiré',300,532,'center','16px '+F,'#fff');t(gnf(r.montant),300,572,'center','bold 30px '+F,'#fff');
 t('Solde du compte : '+gnf(solde(r.client)),300,634,'center','bold 16px '+F,'#16303f');
 t('Signature / cachet',60,700,'left','14px '+F,'#5b7482');x.fillStyle='#16303f';x.fillRect(60,770,200,1);
 [p.resp,'Tél. '+p.tel,p.email,p.adresse].filter(Boolean).forEach((s,i)=>t(s,560,700+i*24,'right',(i?'':'bold ')+'14px '+F,i?'#16303f':'#0e3b5a'));
 t(p.msg,300,836,'center','italic 14px '+F,'#5b7482');return c}
function blob(k,r,cb){try{dessin(k,r,logoOk()).toBlob(cb)}catch(e){dessin(k,r,null).toBlob(cb)}}
function recu(k,id){
 const r=db[k].find(x=>x.id===id);if(!r)return;
 const m=fenetre(`<form class="g"><h2>Reçu ${esc(r.num)}</h2><div id="cv"></div><div class="rang"><button type="button" class="btn s" data-fm="1">Fermer</button><button type="button" class="btn s" id="dl">Télécharger l'image</button><button type="button" class="btn" id="sh">Envoyer par WhatsApp</button></div></form>`);
 let cv;try{cv=dessin(k,r,logoOk())}catch(e){cv=dessin(k,r,null)}
 $('cv').appendChild(cv);const nom='recu-'+r.num+'.png';
 const tel=()=>blob(k,r,b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=nom;a.click()});
 $('dl').onclick=tel;
 $('sh').onclick=()=>blob(k,r,async b=>{const f=new File([b],nom,{type:'image/png'});
  if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:'Reçu '+r.num});return}catch(e){if(e.name==='AbortError')return}}
  tel();window.open('https://wa.me/'+wa((cl(r.client)||{}).tel)+'?text='+encodeURIComponent('Bonjour, voici votre reçu '+r.num+' de '+P().nom+' ('+gnf(r.montant)+'). Image jointe.'),'_blank')})}

function clic(e){
 const d=e.target.dataset;
 if(d.k){cur=d.k;rendu()}
 if(d.add)form(d.add);
 if(d.edit){const[k,id,c]=d.edit.split('|');form(k,id,c)}
 if(d.act==='fbout')deconnecte();
 if(d.det)detail(d.det);
 if(d.recu){const[k,id]=d.recu.split('|');recu(k,id)}
 if(d.del){const[k,id,c]=d.del.split('|');supprime(k,id,c)}
 if(d.fm)ferme();
 if(d.act==='oubli'&&confirm('Cela efface TOUTES les données de ce téléphone (clients, versements, retraits) et le mot de passe. Avec la base en ligne, elles reviendront à la reconnexion ; sinon, restaurez votre sauvegarde. Continuer ?')&&confirm('Dernière confirmation : tout effacer ?')){try{localStorage.removeItem(CLE)}catch(x){}location.reload()}
 if(d.jdel&&confirm('Supprimer cette ligne du journal ?')){fbDel('journal',d.jdel);db.journal=db.journal.filter(x=>x.id!==d.jdel);sauve();rendu()}
 if(d.act==='jdel'){const v=$('js').value;if(!v){alert('Choisissez ce que vous voulez supprimer.');return}
  const lim=Date.now()-Number(v)*864e5,del=db.journal.filter(x=>v==='all'||new Date(x.iso).getTime()<lim);
  if(!del.length){alert('Aucune ligne concernée.');return}
  if(!confirm('Supprimer '+del.length+' ligne(s) du journal ?'))return;
  del.forEach(x=>fbDel('journal',x.id));db.journal=db.journal.filter(x=>!del.includes(x));log('Journal nettoyé : '+del.length+' ligne(s) supprimée(s)');sauve();rendu()}
 if(d.act==='x')exporte();
 if(d.act==='s')sauvegarde();
 if(d.act==='r'){const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>{const r=new FileReader();r.onload=()=>{try{const n=JSON.parse(r.result);if(confirm('Remplacer toutes les données actuelles par cette sauvegarde ?')){const av={};TAB.forEach(t=>av[t]=db[t]);TAB.forEach(t=>db[t]=n[t]||[]);db.cpt={V:0,R:0,...(n.cpt||{})};db.params={...P(),...(n.params||{})};delete db.params.pin;log('Restauration d’une sauvegarde');sauve();rendu();pousse(av);fbMeta('params',P());fbMeta('cpt',db.cpt)}}catch(x){alert('Fichier de sauvegarde invalide.')}};r.readAsText(i.files[0])};i.click()}
 if(d.act==='mdp')formMdp();
 if(d.act==='i'&&dip){dip.prompt();dip=null;e.target.hidden=true}}
async function sauvegarde(){
 const mark=()=>{db.sauv=new Date().toISOString();sauve();rendu()};
 const nom='HAMAC_sauvegarde_'+auj()+'.json',b=new Blob([JSON.stringify({...db,auth:undefined})],{type:'application/json'}),f=new File([b],nom,{type:'application/json'});
 if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:nom});mark();return}catch(e){if(e.name==='AbortError')return}}
 const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=nom;a.click();mark()}
function exporte(){
 if(typeof XLSX==='undefined'){alert("L'export Excel demande une connexion internet. Utilisez la sauvegarde JSON.");return}
 const wb=XLSX.utils.book_new(),add=(n,r)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(r.length?r:[{}]),n);
 add('Clients',db.clients.map(c=>({Nom:c.nom,Téléphone:c.tel,Quartier:c.quartier,Solde:solde(c.id)})));
 add('Versements',db.cotis.map(x=>({'N° reçu':x.num,Date:fd(x.date),Client:nomC(x.client),Montant:x.montant,Mode:x.mode})));
 add('Retraits',db.retraits.map(x=>({'N° reçu':x.num,Date:fd(x.date),Client:nomC(x.client),Montant:x.montant,Motif:x.motif})));
 add('Journal',db.journal.map(x=>({'Date et heure':x.ts,Opération:x.texte})));
 XLSX.writeFile(wb,'HAMAC_SERVICES_'+auj()+'.xlsx')}
document.addEventListener('click',clic);
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;const b=$('bI');if(b)b.hidden=false});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
rendu();
const er=e=>{console.error(e);if(!erFait&&e&&e.code==='permission-denied'){erFait=true;alert('Accès refusé par la base en ligne : vérifiez les règles Firestore (voir le guide).')}};
const col=k=>FS.collection('users/'+U+'/'+k);
function fbSet(k,r){if(FS&&U)col(k).doc(r.id).set(nett(r)).catch(er)}
function fbDel(k,id){if(FS&&U)col(k).doc(id).delete().catch(er)}
function fbMeta(n,o){if(FS&&U)FS.doc('users/'+U+'/meta/'+n).set(nett(o),{merge:true}).catch(er)}
async function pousse(av){
 if(!FS||!U)return;const ops=[];
 TAB.forEach(k=>{(av[k]||[]).forEach(x=>ops.push([k,x.id,null]));db[k].forEach(x=>ops.push([k,x.id,x]))});
 try{for(let i=0;i<ops.length;i+=400){const b=FS.batch();ops.slice(i,i+400).forEach(([k,id,x])=>x?b.set(col(k).doc(id),nett(x)):b.delete(col(k).doc(id)));await b.commit()}}catch(e){er(e)}}
const SDK='https://www.gstatic.com/firebasejs/10.12.5/';
const charge=u=>new Promise((ok,ko)=>{const t=document.createElement('script');t.src=u;t.onload=ok;t.onerror=()=>ko(new Error('chargement '+u));document.head.appendChild(t)});
let tmr;const planRendu=()=>{clearTimeout(tmr);tmr=setTimeout(()=>rendu(true),60)};
async function lanceFb(){
 try{
  for(const f of ['app','auth','firestore'])await charge(SDK+'firebase-'+f+'-compat.js');
  firebase.initializeApp(window.FIREBASE_CONFIG);AUTH=firebase.auth();const fs=firebase.firestore();
  try{await fs.enablePersistence({synchronizeTabs:true})}catch(e){}
  FS=fs;
  AUTH.onAuthStateChanged(u=>{if(u){if(u.uid!==U)abonne(u.uid)}else{U=null;loginFb()}});
 }catch(e){console.error(e);FS=null;rendu(true)}}
function loginFb(){
 document.body.classList.add('v');
 const m=fenetre(`<form class="g"><h2>Connexion à la base en ligne</h2><p>Utilisez l'e-mail et le mot de passe créés dans Firebase.</p><label>E-mail<input type="email" id="le" autocomplete="username" required></label><label>Mot de passe<input type="password" id="lp" autocomplete="current-password" required></label><p id="lm" style="color:var(--rouge)"></p><div class="rang"><button class="btn">Se connecter</button></div></form>`);
 $('le').focus();
 m.querySelector('form').onsubmit=async e=>{e.preventDefault();$('lm').textContent='';
  try{await AUTH.signInWithEmailAndPassword($('le').value.trim(),$('lp').value)}
  catch(x){const c=x.code||'';$('lm').textContent=/invalid|wrong|user-not-found/.test(c)?'E-mail ou mot de passe incorrect.':c==='auth/network-request-failed'?'Pas de connexion internet.':c==='auth/too-many-requests'?'Trop d’essais. Réessayez plus tard.':'Connexion impossible ('+c+').'}}}
async function abonne(uid){
 U=uid;ferme();document.body.classList.remove('v');
 const flag='hamac_fb_'+uid;
 try{if(!localStorage.getItem(flag)){
   localStorage.setItem(CLE+'_avant_en_ligne',localStorage.getItem(CLE)||'');
   const n=db.clients.length+db.cotis.length+db.retraits.length;
   if(n&&confirm('Envoyer les données de ce téléphone ('+db.clients.length+' client(s), '+(db.cotis.length+db.retraits.length)+' opération(s)) vers la base en ligne ?\n\nOK = oui, c’est la première fois.\nAnnuler = non, mes données sont déjà en ligne.')){await pousse({});fbMeta('params',P());fbMeta('cpt',db.cpt)}
   localStorage.setItem(flag,'1')}}catch(e){er(e)}
 ['clients','cotis','retraits','journal'].forEach(k=>col(k).onSnapshot(sn=>{if(sn.metadata.fromCache&&sn.empty&&db[k].length)return;db[k]=sn.docs.map(d=>({...d.data(),id:d.id}));sauve();planRendu()},er));
 FS.doc('users/'+U+'/meta/params').onSnapshot(d=>{if(d.exists){db.params={...db.params,...d.data()};sauve();planRendu()}},er);
 FS.doc('users/'+U+'/meta/cpt').onSnapshot(d=>{if(d.exists){const c=d.data();db.cpt.V=Math.max(db.cpt.V||0,c.V||0);db.cpt.R=Math.max(db.cpt.R||0,c.R||0);sauve()}},er);
 rendu(true)}
async function deconnecte(){
 if(!confirm('Se déconnecter et effacer les copies de ce téléphone ? Vos données restent dans la base en ligne.'+(navigator.onLine?'':'\nAttention : vous êtes hors ligne, les dernières opérations non envoyées seraient perdues.')))return;
 try{await AUTH.signOut();await FS.terminate();await FS.clearPersistence()}catch(e){console.error(e)}
 try{localStorage.removeItem(CLE);localStorage.removeItem('hamac_fb_'+U);localStorage.removeItem(CLE+'_avant_en_ligne')}catch(e){}
 location.reload()}
function ouvert(){ferme();document.body.classList.remove('v');if(EN_LIGNE&&!AUTH)lanceFb()}
addEventListener('online',()=>rendu(true));addEventListener('offline',()=>rendu(true));
let essais=0,bloque=0,sorti=0;
const b64=u=>btoa(String.fromCharCode(...new Uint8Array(u))),ub=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
async function hache(mdp,sel){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(mdp),'PBKDF2',false,['deriveBits']);return b64(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:sel,iterations:150000},k,256))}
async function creeMdp(mdp){const sel=crypto.getRandomValues(new Uint8Array(16));db.auth={s:b64(sel),h:await hache(mdp,sel)};sauve()}
async function verifMdp(mdp){return db.auth&&await hache(mdp,ub(db.auth.s))===db.auth.h}
function verrou(){
 document.body.classList.add('v');
 if(!db.auth){
  const m=fenetre(`<form class="g"><h2>Créer votre mot de passe</h2><p>Il sera demandé à chaque ouverture de l'application. Notez-le bien : en cas d'oubli, les données de ce téléphone devront être effacées (puis restaurées depuis une sauvegarde).</p><label>Mot de passe (6 caractères minimum)<input type="password" id="p1" autocomplete="new-password" required></label><label>Confirmer le mot de passe<input type="password" id="p2" autocomplete="new-password" required></label><div class="rang"><button class="btn">Enregistrer</button></div></form>`);
  $('p1').focus();
  m.querySelector('form').onsubmit=async e=>{e.preventDefault();if($('p1').value.length<6||$('p1').value!==$('p2').value){alert('Les deux mots de passe doivent être identiques (6 caractères minimum).');return}
   await creeMdp($('p1').value);log('Mot de passe créé');sauve();ouvert()};
 }else{
  const m=fenetre(`<form class="g"><h2>Mot de passe</h2><label>Entrez votre mot de passe<input type="password" id="pw" autocomplete="current-password" required></label><div class="rang"><button type="button" class="btn s" data-act="oubli">Mot de passe oublié ?</button><button class="btn">Ouvrir</button></div></form>`);
  $('pw').focus();
  m.querySelector('form').onsubmit=async e=>{e.preventDefault();if(Date.now()<bloque){alert('Trop d’essais. Réessayez dans 30 secondes.');return}
   if(await verifMdp($('pw').value)){essais=0;ouvert()}else{if(++essais>=5){bloque=Date.now()+30000;essais=0}alert('Mot de passe incorrect.');$('pw').value=''}};
 }}
function formMdp(){
 fenetre(`<form id="fm2"><h2>Changer le mot de passe</h2><label>Mot de passe actuel<input type="password" id="a0" autocomplete="current-password" required></label><label>Nouveau mot de passe (6 caractères minimum)<input type="password" id="a1" autocomplete="new-password" required></label><label>Confirmer le nouveau mot de passe<input type="password" id="a2" autocomplete="new-password" required></label><div class="rang"><button type="button" class="btn s" data-fm="1">Annuler</button><button class="btn">Enregistrer</button></div></form>`);
 $('a0').focus();
 $('fm2').onsubmit=async e=>{e.preventDefault();if(!await verifMdp($('a0').value)){alert('Mot de passe actuel incorrect.');return}
  if($('a1').value.length<6||$('a1').value!==$('a2').value){alert('Les deux nouveaux mots de passe doivent être identiques (6 caractères minimum).');return}
  await creeMdp($('a1').value);log('Mot de passe modifié');sauve();ferme();alert('Mot de passe modifié.')}}
document.addEventListener('visibilitychange',()=>{if(document.hidden)sorti=Date.now();else if(sorti&&Date.now()-sorti>3e5&&db.auth&&!document.body.classList.contains('v'))verrou()});
if(window.crypto&&crypto.subtle)verrou();else ouvert();
</script>
